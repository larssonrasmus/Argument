<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        html {
            background: black;
            color: limegreen;
            font-family: monospace;
        }

        body {
            max-width: 480px;
            margin: 0 auto;
        }

        pre {
            text-align: center;
        }

        h1 {
            text-align: center;
            font-weight: normal;
            font-size: 2em;
            margin: 0;
        }

        a {
            color: limegreen;
        }

        p {
            text-align: center;
            font-size: 1.2em;
        }

        form {
            background: rgb(5, 5, 5);
            border: 1px solid limegreen;
            padding: 20px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        form label {
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.5em;
            margin-top: 1em;
            text-align: left;
            text-transform: uppercase;
        }

        form input {
            background: rgb(20, 20, 20);
            color: rgb(0, 255, 0);
            border: 1px solid rgb(63, 63, 63);
            padding: 12px;
            margin: 5px 0;
        }

        form button {
            background: black;
            color: limegreen;
            border: 1px solid limegreen;
            padding: 12px;
            margin: 5px 0;
        }

        form button:hover {
            background: limegreen;
            color: black;
            cursor: pointer;
        }

        footer {
            text-align: center;
        }

        .stats {
            border-bottom: 1px solid rgb(63, 63, 63);
            border-top: 1px solid rgb(63, 63, 63);
            display: flex;
            justify-content: space-between;
            margin: 40px 0;
            padding: 10px 20px;
            text-align: center;
        }

        .metric {
            color: rgb(0, 151, 0);
        }

        .metric span {
            color: rgb(0, 255, 0);
            text-align: center;
            display: block;
            font-size: 1.4em;
        }
    </style>
</head>

<body>
    <pre>{{ .Logo }}</pre>

    <div class="stats">
        <div class="metric">
            <span>247</span>
            users
        </div>
        <div class="metric">
            <span>12</span>
            online
        </div>
        <div class="metric">
            <span>2</span>
            in chat
        </div>
        <div class="metric">
            <span>1,840</span>
            posts
        </div>
    </div>

    <form method="post" action="/register">
        <label for="handle">handle</label>
        <input type="text" name="handle" placeholder="desired alias">
        <label for="password">password</label>
        <input type="password" name="password" placeholder="your password">
        <label for="repeat">password (again)</label>
        <input type="password" name="repeat" placeholder="repeat password">
        <button type="submit">[ apply ]</button>
    </form>

    <footer>
        <p>est. 2026 · running on Go · somewhere on the internet</p>

        <a href="/login">already have an account? [ log in ]</a>
    </footer>
</body>

</html>
